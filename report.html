<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<title>Your report | NamedScan</title>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="logo" href="./"><img src="assets/favicon.svg" alt="" width="30" height="30">NamedScan</a><a class="btn small" href="./#scan">Run a scan</a></div></header>
<main><section><div class="wrap" style="max-width:980px">
<h1 style="color:var(--navy);font-size:34px">Your NamedScan report</h1>
<p class="scanstatus" id="rep-status">Loading your report...</p>
<div id="scan-result" hidden></div>
</div></section></main>
<footer><div class="wrap row"><div><strong style="color:#fff">NamedScan</strong><br>Operated by Joshua Israel Ventures LLC.<br>We work to improve and measure your AI visibility. We do not promise or guarantee rankings or recommendations.</div><div><a href="privacy.html">Privacy</a><br><a href="mailto:joshuaofisrael@gmail.com">Contact</a><br>&copy; 2026 Joshua Israel Ventures LLC</div></div></footer>
<script src="assets/vendor/jspdf.umd.min.js" defer></script>
<script src="assets/report.js" defer></script>
<script defer>
window.addEventListener("DOMContentLoaded", function () {
  var q = new URLSearchParams(location.search), st = document.getElementById("rep-status");
  fetch(NS_API + "/api/report?id=" + encodeURIComponent(q.get("id") || "") + "&k=" + encodeURIComponent(q.get("k") || "")).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { st.className = "scanstatus bad"; st.textContent = j.message || "Report not found."; return; }
    st.hidden = true; var ru = location.href.replace(/[&?]pdf=1/, ""); j.report.report_url = ru; nsRenderReport(document.getElementById("scan-result"), j.report); if (q.get("pdf") === "1") nsPdf(j.report);
  }).catch(function () { st.className = "scanstatus bad"; st.textContent = "We could not load the report. Please try again."; });
});
</script>
</body>
</html>
